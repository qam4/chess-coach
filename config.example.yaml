# Chess Coach configuration
# Copy this file to config.yaml and adjust paths for your system.

engine:
  # Path to the chess engine binary.
  # Use a plain string for a single platform, or a mapping for per-platform paths:
  #   path: "/usr/local/bin/stockfish"          # single platform
  #   path:                                      # multi-platform
  #     linux: "/usr/local/bin/stockfish"
  #     windows: "C:/tools/stockfish.exe"
  #     darwin: "/opt/homebrew/bin/stockfish"
  path: "/usr/local/bin/stockfish"
  # Protocol: "uci" (recommended) or "xboard"
  protocol: "uci"
  # Extra arguments passed to the engine
  # To enable the opening book for variety in play mode:
  # args: ["--book", "path/to/books/i-gm1950.bin"]
  args: []
  # Analysis depth (plies)
  depth: 18
  # Analysis time limit in seconds (overrides depth if set)
  # time_limit: 5.0

llm:
  # Provider: "ollama" or "openai_compat"
  provider: "ollama"
  # Model name (as known by the provider)
  model: "qwen3:8b"
  # Base URL for the LLM API
  base_url: "http://localhost:11434"
  # Max tokens for the coaching response
  max_tokens: 512
  # Temperature (lower = more focused, higher = more creative)
  temperature: 0.7
  # Timeout in seconds for LLM requests (increase for slow models)
  timeout: 300

coaching:
  # Number of engine candidate moves to analyze (the multipv width). This is
  # also the size of the soundness-tagged move menu the coach recommends from;
  # a wider menu gives the coach more sound options and improves the output
  # fidelity checker's unsound-move recall.
  top_moves: 5
  # Coaching style: "beginner", "intermediate", "advanced"
  level: "intermediate"
  # Constrain the coach to name only "best"/"sound" moves from the engine
  # candidate menu (never inventing or recommending a dubious/blunder move).
  # Default on — the primary guard against unsound move advice.
  constrain_moves: true
  # Inject pedagogy guidance (named principles/plans) into coaching prompts.
  # Helps capable reasoning models; the model-capability profiler recommends a
  # value PER MODEL (see docs/model-profiler.md). Default off = no change.
  # (YAML loads on/off as booleans.)
  guidance: off
  # Max guidance entries injected per position.
  guidance_max: 3
  # Skip the LLM and use deterministic templates — recommended for models the
  # profiler finds hallucinate (low factual score / hard errors).
  template_only: false
